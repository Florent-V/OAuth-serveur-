# Développement (chargé automatiquement par « docker compose up »).
# Ports configurables : HTTP_PORT (8080), MAILPIT_PORT (8025), DB_PORT (5432), via l'environnement ou .env.local.
services:
  php:
    build:
      context: .
      target: frankenphp_dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: oauth-server:dev
    volumes:
      # Code monté depuis l'hôte : les modifications sont prises en compte immédiatement
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Les clés et logos restent dans leurs volumes (déclarés dans compose.yaml)
    environment:
      APP_ENV: dev
      # E-mails (codes MFA, mot de passe oublié) capturés par Mailpit : http://localhost:${MAILPIT_PORT:-8025}
      MAILER_DSN: smtp://mailer:1025
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${HTTP_PORT:-8080}:8080"
    tty: true

  database:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  mailer:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
