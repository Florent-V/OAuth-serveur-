security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|bundles)/
            security: false

        # Échange code -> jeton : authentification du client par client_id/client_secret, pas de session
        oauth_token:
            pattern: ^/token$
            security: false

        # Endpoints appelés par les applications avec un jeton Bearer
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            oauth2: true

        # Pages web : connexion, inscription, /authorize, portail, administration
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                # Tout changement de l'une de ces valeurs invalide les cookies « rester connecté »
                signature_properties: ['password', 'enabled', 'sessionVersion']
            logout:
                path: app_logout
                target: app_login
            # MFA : code à 6 chiffres par e-mail, puis « appareil de confiance » (voir scheb_2fa.yaml)
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true
                trusted_parameter_name: _trusted
                # Envoie le code dès la validation du mot de passe
                prepare_on_login: true

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    access_control:
        - { path: ^/(login|register|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/authorize, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/, roles: IS_AUTHENTICATED_REMEMBERED }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
